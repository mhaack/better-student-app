name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Lint and tests share the "test" job: it's the check main's branch
  # protection requires, so both have to pass before a PR can merge.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The linter is the only dependency; the tests themselves need none.
      - run: npm ci
      - run: npm run lint
      - run: npm test

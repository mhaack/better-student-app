<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Bessere Schule — Brag</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'Instrument Sans';
        font-style: normal;
        font-weight: 400 700;
        src: url('assets/fonts/instrument-sans.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: normal;
        font-weight: 400;
        src: url('assets/fonts/instrument-serif.woff2') format('woff2');
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #F6F3EE;
        font-family: 'Instrument Sans', sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #F6F3EE;
      }

      .clip { position: absolute; inset: 0; }
      .inner { position: absolute; inset: 0; }

      /* Scene 1 + 5: text scenes */
      .text-scene {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        padding: 0 90px;
        text-align: center;
      }
      .hook-lines { display: flex; flex-direction: column; gap: 4px; }
      .hook-line {
        font-family: 'Instrument Serif', serif;
        font-size: 82px;
        line-height: 1.08;
        color: #1A1714;
      }
      .wordmark {
        font-family: 'Instrument Sans', sans-serif;
        font-weight: 600;
        font-size: 34px;
        letter-spacing: 0.01em;
        color: #57504A;
      }
      .outro-line1 {
        font-family: 'Instrument Serif', serif;
        font-size: 66px;
        line-height: 1.15;
        color: #1A1714;
        max-width: 820px;
      }
      .outro-line2 {
        font-family: 'Instrument Sans', sans-serif;
        font-weight: 500;
        font-size: 32px;
        color: #57504A;
        max-width: 760px;
      }
      .outro-sub {
        font-family: 'Instrument Sans', sans-serif;
        font-weight: 400;
        font-size: 22px;
        color: #6F6862;
      }

      /* Scenes 2-4: phone frame scenes */
      .phone-scene {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .phone-wrap {
        position: relative;
        width: 860px;
        height: 1612px;
        border-radius: 42px;
        overflow: hidden;
        box-shadow: 0 30px 70px rgba(26, 23, 20, 0.16), 0 0 0 1px rgba(26, 23, 20, 0.06);
        background: #F6F3EE;
      }
      .phone-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        transform-origin: center top;
      }
      .glow-box {
        position: absolute;
        border-radius: 16px;
        border: 3px solid #A8341C;
        background: rgba(168, 52, 28, 0.07);
        box-shadow: 0 0 0 7px rgba(168, 52, 28, 0.10);
        pointer-events: none;
      }
      .mask-box {
        position: absolute;
        background: #F6F3EE;
      }
      .average-overlay {
        position: absolute;
        display: flex;
        align-items: baseline;
        gap: 10px;
        background: #F6F3EE;
      }
      .average-overlay .num {
        font-family: 'Instrument Serif', serif;
        font-size: 107px;
        line-height: 0.9;
        color: #1A1714;
        white-space: nowrap;
      }
      .average-overlay .suffix {
        font-family: 'Instrument Serif', serif;
        font-size: 54px;
        color: #1A1714;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="brag" data-width="1080" data-height="1920" data-duration="20">

      <!-- Scene 1: Hook (0 - 2.9) -->
      <section id="s1" class="clip" data-start="0" data-duration="2.9" data-track-index="0">
        <div id="s1-inner" class="inner text-scene">
          <div class="hook-lines">
            <div id="s1-line1" class="hook-line">Deine Noten.</div>
            <div id="s1-line2" class="hook-line">Kein Server dazwischen.</div>
          </div>
          <div id="s1-wordmark" class="wordmark">Bessere Schule</div>
        </div>
      </section>

      <!-- Scene 2: Heute (2.5 - 7.9) -->
      <section id="s2" class="clip" data-start="2.5" data-duration="5.4" data-track-index="0">
        <div id="s2-inner" class="inner phone-scene">
          <div class="phone-wrap">
            <img id="s2-img" class="phone-img" src="assets/images/heute.png" alt="Heute" />
            <div id="s2-glow" class="glow-box" style="left:43px; top:183px; width:774px; height:181px;"></div>
          </div>
        </div>
      </section>

      <!-- Scene 3: Stundenplan (7.5 - 12.4) -->
      <section id="s3" class="clip" data-start="7.5" data-duration="4.9" data-track-index="0">
        <div id="s3-inner" class="inner phone-scene">
          <div class="phone-wrap">
            <img id="s3-img" class="phone-img" src="assets/images/stundenplan.png" alt="Stundenplan" />
            <div id="s3-glow-1" class="glow-box" style="left:79px; top:387px; width:141px; height:104px;"></div>
            <div id="s3-glow-2" class="glow-box" style="left:79px; top:498px; width:141px; height:104px;"></div>
            <div id="s3-glow-3" class="glow-box" style="left:377px; top:498px; width:141px; height:104px;"></div>
            <div id="s3-glow-4" class="glow-box" style="left:79px; top:609px; width:141px; height:104px;"></div>
          </div>
        </div>
      </section>

      <!-- Scene 4: Noten (12.0 - 16.9) -->
      <section id="s4" class="clip" data-start="12.0" data-duration="4.9" data-track-index="0">
        <div id="s4-inner" class="inner phone-scene">
          <div class="phone-wrap">
            <img id="s4-img" class="phone-img" src="assets/images/noten.png" alt="Noten" />
            <div id="s4-mask" class="mask-box" style="left:43px; top:431px; width:774px; height:260px;"></div>
            <div id="s4-average" class="average-overlay" style="left:43px; top:226px; width:400px; height:97px;">
              <span id="s4-num" class="num">0</span><span class="suffix"> P</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Scene 5: Outro (16.5 - 20.0) -->
      <section id="s5" class="clip" data-start="16.5" data-duration="3.5" data-track-index="0">
        <div id="s5-inner" class="inner text-scene">
          <div id="s5-line1" class="outro-line1">Dein Passwort sieht nur beste.schule.</div>
          <div id="s5-line2" class="outro-line2">Noten, Stundenplan, Vertretungen. Ohne Umwege.</div>
          <div id="s5-line3" class="outro-sub">Inoffiziell. Nicht verbunden mit beste.schule.</div>
        </div>
      </section>

      <!-- Audio -->
      <audio
        id="bgm"
        src="assets/music/happy-beats-business-moves-vol-9-by-ende-dot-app.mp3"
        data-start="0"
        data-duration="20"
        data-track-index="10"
        data-volume="0.55"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":1,"v":0.55},{"t":18.5,"v":0.55},{"t":20,"v":0}]}]}'
      ></audio>

      <!-- beat-locked: 4.23s (strong cue) -->
      <audio id="sfx-heute" src="assets/sfx/bong_001.ogg" data-start="4.23" data-duration="0.12" data-track-index="11" data-volume="0.7"></audio>

      <!-- beat-grid: sp tick 1 at 7.92s, tick 2 at 8.44s, tick 3 at 8.96s, tick 4 at 9.50s -->
      <audio id="sfx-sp1" src="assets/sfx/click2.ogg" data-start="7.92" data-duration="0.06" data-track-index="12" data-volume="0.55"></audio>
      <audio id="sfx-sp2" src="assets/sfx/click2.ogg" data-start="8.44" data-duration="0.06" data-track-index="13" data-volume="0.55"></audio>
      <audio id="sfx-sp3" src="assets/sfx/click2.ogg" data-start="8.96" data-duration="0.06" data-track-index="14" data-volume="0.55"></audio>
      <audio id="sfx-sp4" src="assets/sfx/click2.ogg" data-start="9.50" data-duration="0.06" data-track-index="15" data-volume="0.55"></audio>

      <!-- beat-locked: 12.65s (strong cue) -->
      <audio id="sfx-noten" src="assets/sfx/impactSoft_medium_001.ogg" data-start="12.65" data-duration="0.18" data-track-index="16" data-volume="0.7"></audio>

    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // ---------- Scene 1: Hook (0 - 2.9) ----------
      tl.fromTo("#s1-line1", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.15);
      tl.fromTo("#s1-line2", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.4);
      tl.fromTo("#s1-wordmark", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 1.0);
      // crossfade S1 -> S2
      tl.to("#s1-inner", { opacity: 0, duration: 0.4, ease: "power1.inOut" }, 2.5);

      // ---------- Scene 2: Heute (2.5 - 7.9) ----------
      tl.set("#s2-inner", { opacity: 0 }, 2.5);
      tl.to("#s2-inner", { opacity: 1, duration: 0.4, ease: "power1.inOut" }, 2.5);
      tl.fromTo("#s2-img", { scale: 0.94 }, { scale: 1.0, duration: 0.5, ease: "power3.out" }, 2.9);
      // slow Ken Burns drift for the rest of the scene
      tl.to("#s2-img", { scale: 1.045, duration: 4.0, ease: "none" }, 3.4);
      tl.fromTo("#s2-glow", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 4.23); // beat-locked
      // crossfade S2 -> S3
      tl.to("#s2-inner", { opacity: 0, duration: 0.4, ease: "power1.inOut" }, 7.5);

      // ---------- Scene 3: Stundenplan (7.5 - 12.4) ----------
      tl.set("#s3-inner", { opacity: 0 }, 7.5);
      tl.to("#s3-inner", { opacity: 1, duration: 0.4, ease: "power1.inOut" }, 7.5);
      tl.fromTo("#s3-img", { scale: 0.94 }, { scale: 1.0, duration: 0.4, ease: "power3.out" }, 7.9);
      tl.to("#s3-img", { scale: 1.04, duration: 3.6, ease: "none" }, 8.3);
      tl.fromTo("#s3-glow-1", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.6)" }, 7.92); // beat-grid
      tl.fromTo("#s3-glow-2", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.6)" }, 8.44); // beat-grid
      tl.fromTo("#s3-glow-3", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.6)" }, 8.96); // beat-grid
      tl.fromTo("#s3-glow-4", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.6)" }, 9.50); // beat-grid
      // crossfade S3 -> S4
      tl.to("#s3-inner", { opacity: 0, duration: 0.4, ease: "power1.inOut" }, 12.0);

      // ---------- Scene 4: Noten (12.0 - 16.9) ----------
      tl.set("#s4-inner", { opacity: 0 }, 12.0);
      tl.to("#s4-inner", { opacity: 1, duration: 0.4, ease: "power1.inOut" }, 12.0);
      tl.fromTo("#s4-img", { scale: 0.94 }, { scale: 1.0, duration: 0.4, ease: "power3.out" }, 12.4);
      tl.to("#s4-img", { scale: 1.035, duration: 3.6, ease: "none" }, 12.8);
      // count-up 0 -> 11, landing beat-locked at 12.65s (strong cue)
      const notenCounter = { v: 0 };
      tl.to(notenCounter, {
        v: 11,
        duration: 0.65,
        ease: "power2.out",
        onUpdate: () => {
          document.getElementById("s4-num").textContent = Math.round(notenCounter.v);
        },
      }, 12.0);
      // reveal the LK/GK subject rows right after the average lands
      tl.to("#s4-mask", { opacity: 0, duration: 0.4, ease: "power1.inOut" }, 12.65); // beat-locked
      // crossfade S4 -> S5
      tl.to("#s4-inner", { opacity: 0, duration: 0.4, ease: "power1.inOut" }, 16.5);

      // ---------- Scene 5: Outro (16.5 - 20.0) ----------
      tl.set("#s5-inner", { opacity: 0 }, 16.5);
      tl.to("#s5-inner", { opacity: 1, duration: 0.4, ease: "power1.inOut" }, 16.5);
      tl.fromTo("#s5-line1", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 16.9);
      tl.fromTo("#s5-line2", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 17.35);
      tl.fromTo("#s5-line3", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 17.7);

      window.__timelines["brag"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
